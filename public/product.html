<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      html,
      body {
        background: #050607;
      }

      .topbar {
        background: rgba(247, 247, 242, 0.82);
      }

      html[data-theme="dark"] .topbar {
        background: rgba(24, 27, 32, 0.88);
      }

      @media (prefers-color-scheme: dark) {
        html:not([data-theme="light"]) .topbar {
          background: rgba(24, 27, 32, 0.88);
        }
      }
    </style>
    <title>Мерч | Товар</title>
    <link rel="icon" type="image/png" href="/assets/images/favicon.png" />
    <link rel="apple-touch-icon" href="/assets/images/favicon.png" />
    <script src="/theme-head.js"></script>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body data-page="product">
    <div class="site-shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="Главная">
          <span class="brand-mark" aria-hidden="true">
            <span class="brand-mark__vertical"></span>
            <span class="brand-mark__horizontal"></span>
          </span>
          <span class="brand-copy">
            <span class="brand-copy__tagline">Мерч команды<br />по ответственнастям</span>
          </span>
        </a>
        <nav class="topnav" aria-label="Основная навигация">
          <a href="/" data-i18n="nav.home">Главная</a>
          <a href="/catalog" data-i18n="nav.catalog">Каталог</a>
          <a href="/about" data-i18n="nav.about">О нас</a>
        </nav>
        <div class="topbar-actions">
          <label class="lang-switch">
            <span data-i18n="lang.label">Язык</span>
            <select data-lang-switch aria-label="Language">
              <option value="ru">RU</option>
              <option value="en">EN</option>
            </select>
          </label>
          <a class="cart-trigger" href="/cart">
            <span data-i18n="nav.cart">Корзина</span>
            <span class="cart-badge" data-cart-count>0</span>
          </a>
        </div>
      </header>

      <main class="section section--full">
        <div data-product-page></div>
      </main>
    </div>

    <script type="module" src="/main.js"></script>
  </body>
</html>
