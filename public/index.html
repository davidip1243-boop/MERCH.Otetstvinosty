<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Мерч | Главная</title>
    <meta
      name="description"
      data-i18n-content="index.meta.description"
      content="Минималистичный интернет-магазин мерча с лаконичной эстетикой, локальной корзиной и заказами в Telegram."
    />
    <link rel="icon" type="image/png" href="/assets/images/favicon.png" />
    <link rel="apple-touch-icon" href="/assets/images/favicon.png" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body data-page="home">
    <div class="site-shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="Главная">
          <span class="brand-mark" aria-hidden="true">
            <span class="brand-mark__vertical"></span>
            <span class="brand-mark__horizontal"></span>
          </span>
          <span class="brand-copy">
            <span class="brand-copy__tagline">Мерч команды<br />по ответственнастям</span>
          </span>
        </a>
        <nav class="topnav" aria-label="Основная навигация">
          <a href="/" aria-current="page" data-i18n="nav.home">Главная</a>
          <a href="/catalog" data-i18n="nav.catalog">Каталог</a>
        </nav>
        <div class="topbar-actions">
          <label class="lang-switch">
            <span data-i18n="lang.label">Язык</span>
            <select data-lang-switch aria-label="Language">
              <option value="ru">RU</option>
              <option value="en">EN</option>
            </select>
          </label>
          <a class="cart-trigger" href="/cart">
            <span data-i18n="nav.cart">Корзина</span>
            <span class="cart-badge" data-cart-count>0</span>
          </a>
        </div>
      </header>

      <main>
        <section class="home-focus">
          <div class="home-focus__copy">
            <img class="home-focus__logo" src="/assets/images/brand-mark.png" alt="" />
            <a class="home-focus__title-link" href="/catalog">
              <h1>Знаешь ли ты,<br />кто мы?</h1>
            </a>
            <p>Мерч команды по ответственнастям.</p>
            <a class="home-focus__cta" href="/catalog">Открыть каталог</a>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="/main.js"></script>
  </body>
</html>
