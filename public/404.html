<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      html,
      body {
        background: #050607;
      }

      .topbar {
        background: rgba(13, 13, 15, 0.92);
      }
    </style>
    <title>Страница не найдена</title>
    <link rel="icon" type="image/png" href="/assets/images/favicon.png" />
    <link rel="apple-touch-icon" href="/assets/images/favicon.png" />
    <script src="/theme-head.js"></script>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body data-page="404">
    <main class="not-found">
      <section class="not-found__panel" aria-labelledby="not-found-title">
        <a class="brand brand--center" href="/" aria-label="Вернуться на главную">
          <span class="brand-mark" aria-hidden="true">
            <span class="brand-mark__vertical"></span>
            <span class="brand-mark__horizontal"></span>
          </span>
        </a>
        <p class="eyebrow">404</p>
        <h1 id="not-found-title">Страница не найдена. Но, возможно, ты найдешь себя!</h1>
        <a class="button button--solid" href="/">Вернуться на главную</a>
      </section>
    </main>
  </body>
</html>
