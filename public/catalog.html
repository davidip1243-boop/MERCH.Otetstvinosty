<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      html,
      body {
        background: #050607;
      }

      .topbar {
        background: rgba(247, 247, 242, 0.82);
      }

      html[data-theme="dark"] .topbar {
        background: rgba(24, 27, 32, 0.88);
      }

      @media (prefers-color-scheme: dark) {
        html:not([data-theme="light"]) .topbar {
          background: rgba(24, 27, 32, 0.88);
        }
      }
    </style>
    <title>Мерч | Каталог</title>
    <link rel="icon" type="image/png" href="/assets/images/favicon.png" />
    <link rel="apple-touch-icon" href="/assets/images/favicon.png" />
    <script src="/theme-head.js"></script>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body data-page="catalog">
    <div class="site-shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="Главная">
          <span class="brand-mark" aria-hidden="true">
            <span class="brand-mark__vertical"></span>
            <span class="brand-mark__horizontal"></span>
          </span>
          <span class="brand-copy">
            <span class="brand-copy__tagline">Мерч команды<br />по ответственностям</span>
          </span>
        </a>
        <nav class="topnav" aria-label="Основная навигация">
          <a href="/" data-i18n="nav.home">Главная</a>
          <a href="/catalog" aria-current="page" data-i18n="nav.catalog">Каталог</a>
          <a href="/about" data-i18n="nav.about">О нас</a>
        </nav>
        <div class="topbar-actions">
          <a class="cart-trigger" href="/cart">
            <span data-i18n="nav.cart">Корзина</span>
            <span class="cart-badge" data-cart-count>0</span>
          </a>
        </div>
      </header>

      <main>
        <section class="section catalog-wall">
          <div class="catalog-stage">
            <div class="catalog-grid" data-catalog-grid></div>
          </div>
        </section>
      </main>

      <footer class="site-footer">
        <p data-i18n="catalog.footer">Доставка по России, оформление заказа без создания аккаунта.</p>
        <div class="footer-links">
          <a href="https://t.me/" target="_blank" rel="noreferrer" data-i18n="common.telegram">Telegram</a>
          <a href="https://www.youtube.com/" target="_blank" rel="noreferrer" data-i18n="common.youtube">YouTube</a>
        </div>
      </footer>
    </div>

    <script type="module" src="/main.js"></script>
  </body>
</html>
