<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      html,
      body {
        background: #050607;
      }

      .topbar {
        background: rgba(247, 247, 242, 0.82);
      }

      html[data-theme="dark"] .topbar {
        background: rgba(24, 27, 32, 0.88);
      }

      @media (prefers-color-scheme: dark) {
        html:not([data-theme="light"]) .topbar {
          background: rgba(24, 27, 32, 0.88);
        }
      }
    </style>
    <title>Мерч | Каталог</title>
    <link rel="icon" type="image/png" href="/assets/images/favicon.png" />
    <link rel="apple-touch-icon" href="/assets/images/favicon.png" />
    <script src="/theme-head.js"></script>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body data-page="catalog">
    <div class="site-shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="Главная">
          <span class="brand-mark" aria-hidden="true">
            <span class="brand-mark__vertical"></span>
            <span class="brand-mark__horizontal"></span>
          </span>
          <span class="brand-copy">
            <span class="brand-copy__tagline">Мерч команды<br />по ответственнастям</span>
          </span>
        </a>
        <nav class="topnav" aria-label="Основная навигация">
          <a href="/" data-i18n="nav.home">Главная</a>
          <a href="/catalog" aria-current="page" data-i18n="nav.catalog">Каталог</a>
          <a href="/about" data-i18n="nav.about">О нас</a>
        </nav>
        <div class="topbar-actions">
          <a class="cart-trigger" href="/cart">
            <span data-i18n="nav.cart">Корзина</span>
            <span class="cart-badge" data-cart-count>0</span>
          </a>
        </div>
      </header>

      <main>
        <section class="section catalog-market">
          <div class="catalog-market__hero">
            <div>
              <p class="product-meta">Каталог</p>
              <h1>Мерч команды</h1>
              <p>Быстрый выбор вещей, свечей, крестов и сумок. Всё собрано в одной витрине.</p>
            </div>
            <div class="catalog-market__stats">
              <span data-catalog-count>0 товаров</span>
              <strong>Ответственность в деталях</strong>
            </div>
          </div>

          <div class="catalog-toolbar">
            <label class="catalog-search">
              <span>Поиск</span>
              <input data-catalog-search type="search" placeholder="Худи, крест, свеча..." />
            </label>
            <label class="catalog-sort">
              <span>Сортировка</span>
              <select data-catalog-sort>
                <option value="featured">Сначала новые</option>
                <option value="price-asc">Цена вверх</option>
                <option value="price-desc">Цена вниз</option>
                <option value="name">По названию</option>
              </select>
            </label>
          </div>

          <div class="catalog-filters" aria-label="Категории каталога">
            <button class="catalog-filter is-active" type="button" data-catalog-filter="all"><span>Все</span></button>
            <button class="catalog-filter" type="button" data-catalog-filter="clothes"><span>Одежда</span></button>
            <button class="catalog-filter" type="button" data-catalog-filter="bags"><span>Сумки</span></button>
            <button class="catalog-filter" type="button" data-catalog-filter="candles"><span>Свечи</span></button>
            <button class="catalog-filter" type="button" data-catalog-filter="crosses"><span>Кресты</span></button>
          </div>
          <div class="catalog-grid" data-catalog-grid></div>
        </section>
      </main>

      <footer class="site-footer">
        <p data-i18n="catalog.footer">Доставка по России, оформление заказа без создания аккаунта.</p>
        <div class="footer-links">
          <a href="https://t.me/" target="_blank" rel="noreferrer" data-i18n="common.telegram">Telegram</a>
          <a href="https://www.youtube.com/" target="_blank" rel="noreferrer" data-i18n="common.youtube">YouTube</a>
        </div>
      </footer>
    </div>

    <script type="module" src="/main.js"></script>
  </body>
</html>
