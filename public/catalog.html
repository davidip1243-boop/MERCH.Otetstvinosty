<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Мерч | Каталог</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body data-page="catalog">
    <div class="site-shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="Главная">
          <span class="brand-mark" aria-hidden="true">
            <span class="brand-mark__vertical"></span>
            <span class="brand-mark__horizontal"></span>
          </span>
          <span class="brand-copy">
            <strong>MERCH</strong>
            <span>quiet essentials</span>
          </span>
        </a>
        <nav class="topnav" aria-label="Основная навигация">
          <a href="/" data-i18n="nav.home">Главная</a>
          <a href="/catalog" aria-current="page" data-i18n="nav.catalog">Каталог</a>
        </nav>
        <div class="topbar-actions">
          <label class="lang-switch">
            <span data-i18n="lang.label">Язык</span>
            <select data-lang-switch aria-label="Language">
              <option value="ru">RU</option>
              <option value="en">EN</option>
            </select>
          </label>
          <a class="cart-trigger" href="/cart">
            <span data-i18n="nav.cart">Корзина</span>
            <span class="cart-badge" data-cart-count>0</span>
          </a>
        </div>
      </header>

      <main>
        <section class="section">
          <div class="catalog-filters">
            <button class="catalog-filter is-active" type="button" data-catalog-filter="all">Все</button>
            <button class="catalog-filter" type="button" data-catalog-filter="clothes">Одежда</button>
            <button class="catalog-filter" type="button" data-catalog-filter="candles">Свечи</button>
            <button class="catalog-filter" type="button" data-catalog-filter="crosses">Кресты</button>
          </div>
          <div class="catalog-grid" data-catalog-grid></div>
        </section>
      </main>

      <footer class="site-footer">
        <p data-i18n="catalog.footer">Доставка по России, оформление заказа без создания аккаунта.</p>
        <div class="footer-links">
          <a href="https://t.me/" target="_blank" rel="noreferrer" data-i18n="common.telegram">Telegram</a>
          <a href="https://www.youtube.com/" target="_blank" rel="noreferrer" data-i18n="common.youtube">YouTube</a>
        </div>
      </footer>
    </div>

    <script type="module" src="/main.js"></script>
  </body>
</html>
