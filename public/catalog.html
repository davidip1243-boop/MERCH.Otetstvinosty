<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Мерч | Каталог</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body data-page="catalog">
    <div class="site-shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="Главная">
          <span class="brand-mark" aria-hidden="true">
            <span class="brand-mark__vertical"></span>
            <span class="brand-mark__horizontal"></span>
          </span>
          <span class="brand-copy">
            <strong>MERCH</strong>
            <span>quiet essentials</span>
          </span>
        </a>
        <nav class="topnav" aria-label="Основная навигация">
          <a href="/" data-i18n="nav.home">Главная</a>
          <a href="/catalog" aria-current="page" data-i18n="nav.catalog">Каталог</a>
          <a href="/delivery" data-i18n="nav.delivery">Доставка</a>
        </nav>
        <label class="lang-switch">
          <span data-i18n="lang.label">Язык</span>
          <select data-lang-switch aria-label="Language">
            <option value="ru">RU</option>
            <option value="en">EN</option>
          </select>
        </label>
        <a class="cart-trigger" href="/cart" target="_blank" rel="noopener">
          <span data-i18n="nav.cart">Корзина</span>
          <span class="cart-badge" data-cart-count>0</span>
        </a>
      </header>

      <main>
        <section class="section">
          <div class="catalog-filters">
            <button class="catalog-filter is-active" type="button" data-catalog-filter="all">Все</button>
            <button class="catalog-filter" type="button" data-catalog-filter="clothes">Одежда</button>
            <button class="catalog-filter" type="button" data-catalog-filter="candles">Свечи</button>
            <button class="catalog-filter" type="button" data-catalog-filter="crosses">Кресты</button>
          </div>
          <div class="catalog-grid" data-catalog-grid></div>
        </section>
      </main>

      <footer class="site-footer">
        <p data-i18n="catalog.footer">Доставка по России, оформление заказа без создания аккаунта.</p>
        <div class="footer-links">
          <a href="https://t.me/" target="_blank" rel="noreferrer" data-i18n="common.telegram">Telegram</a>
          <a href="https://www.youtube.com/" target="_blank" rel="noreferrer" data-i18n="common.youtube">YouTube</a>
        </div>
      </footer>
    </div>

    <aside class="cart-drawer" data-cart-drawer aria-hidden="true">
      <div class="cart-backdrop" data-cart-close></div>
      <div class="cart-panel glass-panel">
        <div class="cart-head">
          <div>
            <p class="eyebrow">Корзина</p>
            <h2>Оформление без регистрации</h2>
          </div>
          <button class="icon-button" type="button" data-cart-close aria-label="Закрыть корзину">×</button>
        </div>
        <div class="cart-items" data-cart-items></div>
        <form class="checkout-form" data-checkout-form>
          <label>
            <span data-i18n="checkout.fullName">ФИО</span>
            <input name="fullName" type="text" placeholder="Иванов Иван Иванович" data-i18n-placeholder="checkout.fullNamePlaceholder" required />
          </label>
          <label>
            <span data-i18n="checkout.phone">Телефон</span>
            <input name="phone" type="tel" placeholder="+7 999 123-45-67" data-i18n-placeholder="checkout.phonePlaceholder" required />
          </label>
          <label>
            <span data-i18n="checkout.address">Адрес</span>
            <textarea name="address" rows="3" placeholder="Город, улица, дом, квартира" data-i18n-placeholder="checkout.addressPlaceholder" required></textarea>
          </label>
          <label>
            <span data-i18n="checkout.telegram">Ник в Telegram</span>
            <input name="telegram" type="text" placeholder="@username" data-i18n-placeholder="checkout.telegramPlaceholder" />
          </label>
          <div class="checkout-summary">
            <span data-i18n="checkout.total">Итого</span>
            <strong data-cart-total>0 ₽</strong>
          </div>
          <button class="button button--solid button--full" type="submit" data-i18n="checkout.submit">Отправить заказ</button>
          <p class="form-status" data-checkout-status></p>
        </form>
      </div>
    </aside>

    <script type="module" src="/main.js"></script>
  </body>
</html>
