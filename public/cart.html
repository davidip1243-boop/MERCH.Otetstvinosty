<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Мерч | Корзина</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body data-page="cart">
    <div class="site-shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="Главная">
          <span class="brand-mark" aria-hidden="true">
            <span class="brand-mark__vertical"></span>
            <span class="brand-mark__horizontal"></span>
          </span>
          <span class="brand-copy">
            <strong>MERCH</strong>
            <span>quiet essentials</span>
          </span>
        </a>
        <nav class="topnav" aria-label="Основная навигация">
          <a href="/">Главная</a>
          <a href="/catalog">Каталог</a>
          <a href="/cart" aria-current="page">Корзина</a>
        </nav>
        <a class="button button--ghost" href="/catalog">Вернуться в каталог</a>
      </header>

      <main>
        <section class="hero hero--compact">
          <div class="hero-copy">
            <p class="eyebrow">Корзина</p>
            <h1>Оформление без регистрации</h1>
            <p class="lead">Проверьте состав заказа, заполните данные и отправьте заявку в один шаг.</p>
          </div>
        </section>

        <section class="section checkout-page">
          <div class="glass-panel checkout-page__panel">
            <div class="cart-items" data-cart-items></div>
            <form class="checkout-form" data-checkout-form>
              <label>
                ФИО
                <input name="fullName" type="text" placeholder="Иванов Иван Иванович" required />
              </label>
              <label>
                Телефон
                <input name="phone" type="tel" placeholder="+7 999 123-45-67" required />
              </label>
              <label>
                Адрес
                <textarea name="address" rows="3" placeholder="Город, улица, дом, квартира" required></textarea>
              </label>
              <label>
                Ник в Telegram
                <input name="telegram" type="text" placeholder="@username" />
              </label>
              <div class="checkout-summary">
                <span>Итого</span>
                <strong data-cart-total>0 ₽</strong>
              </div>
              <button class="button button--solid button--full" type="submit">Отправить заказ</button>
              <p class="form-status" data-checkout-status></p>
            </form>
          </div>
        </section>
      </main>

      <footer class="site-footer">
        <p>Оформление заказа в полном экране с той же визуальной системой магазина.</p>
        <div class="footer-links">
          <a href="https://t.me/" target="_blank" rel="noreferrer">Telegram</a>
        </div>
      </footer>
    </div>

    <script type="module" src="/main.js"></script>
  </body>
</html>
