<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Мерч | Корзина</title>
    <link rel="icon" type="image/png" href="/assets/images/favicon.png" />
    <link rel="apple-touch-icon" href="/assets/images/favicon.png" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body data-page="cart">
    <div class="site-shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="Главная">
          <span class="brand-mark" aria-hidden="true">
            <span class="brand-mark__vertical"></span>
            <span class="brand-mark__horizontal"></span>
          </span>
          <span class="brand-copy">
            <span class="brand-copy__tagline">Мерч команды<br />по ответственнастям</span>
          </span>
        </a>
        <nav class="topnav" aria-label="Основная навигация">
          <a href="/">Главная</a>
          <a href="/catalog">Каталог</a>
          <a href="/about">О нас</a>
        </nav>
        <div class="topbar-actions topbar-actions--empty" aria-hidden="true"></div>
      </header>

      <main>
        <section class="section checkout-page">
          <div class="glass-panel checkout-page__panel" data-checkout-panel>
            <div class="cart-order-list">
              <div class="cart-items" data-cart-items></div>
              <div class="cart-checkout-gate" data-checkout-gate hidden>
                <div class="checkout-summary">
                  <span>Выбрано</span>
                  <strong data-selected-cart-total>0 ₽</strong>
                </div>
                <button class="button button--solid" type="button" data-checkout-start>Оформить</button>
              </div>
            </div>
            <form class="checkout-form" data-checkout-form hidden>
              <div class="checkout-form__head">
                <button class="button button--ghost" type="button" data-checkout-back>Назад в корзину</button>
              </div>
              <label>
                ФИО
                <input name="fullName" type="text" placeholder="Иванов Иван Иванович" required />
              </label>
              <label>
                Телефон
                <input name="phone" type="tel" placeholder="+7 999 123-45-67" required />
              </label>
              <label>
                Адрес
                <textarea name="address" rows="3" placeholder="Город, улица, дом, квартира" required></textarea>
              </label>
              <label>
                Ник в Telegram
                <input name="telegram" type="text" placeholder="@username" />
              </label>
              <div class="checkout-summary">
                <span>Итого</span>
                <strong data-cart-total>0 ₽</strong>
              </div>
              <button class="button button--solid button--full" type="submit">Отправить заказ</button>
              <p class="form-status" data-checkout-status></p>
            </form>
          </div>
        </section>
      </main>

      <footer class="site-footer">
        <p>Оформление заказа в полном экране с той же визуальной системой магазина.</p>
        <div class="footer-links">
          <a href="https://t.me/" target="_blank" rel="noreferrer">Telegram</a>
        </div>
      </footer>
    </div>

    <script type="module" src="/main.js"></script>
  </body>
</html>
