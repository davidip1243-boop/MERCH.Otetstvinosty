<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      html,
      body {
        background: #050607;
      }

      .topbar {
        background: rgba(247, 247, 242, 0.82);
      }

      html[data-theme="dark"] .topbar {
        background: rgba(24, 27, 32, 0.88);
      }

      @media (prefers-color-scheme: dark) {
        html:not([data-theme="light"]) .topbar {
          background: rgba(24, 27, 32, 0.88);
        }
      }
    </style>
    <title>Мерч | Корзина</title>
    <link rel="icon" type="image/png" href="/assets/images/favicon.png" />
    <link rel="apple-touch-icon" href="/assets/images/favicon.png" />
    <script src="/theme-head.js"></script>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body data-page="cart">
    <div class="site-shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="Главная">
          <span class="brand-mark" aria-hidden="true">
            <span class="brand-mark__vertical"></span>
            <span class="brand-mark__horizontal"></span>
          </span>
          <span class="brand-copy">
            <span class="brand-copy__tagline">Мерч команды<br />по ответственностям</span>
          </span>
        </a>
        <nav class="topnav" aria-label="Основная навигация">
          <a href="/">Главная</a>
          <a href="/catalog">Каталог</a>
          <a href="/about">О нас</a>
        </nav>
        <div class="topbar-actions topbar-actions--empty" aria-hidden="true"></div>
      </header>

      <main>
        <section class="section checkout-page">
          <div class="glass-panel checkout-page__panel" data-checkout-panel>
            <div class="cart-order-list">
              <div class="cart-items" data-cart-items></div>
            </div>
            <form class="checkout-form" data-checkout-form hidden>
              <div class="checkout-form__head">
                <button class="button button--ghost" type="button" data-checkout-back>Назад в корзину</button>
              </div>
              <label>
                ФИО
                <input name="fullName" type="text" placeholder="Иванов Иван Иванович" required />
              </label>
              <label>
                Телефон
                <input name="phone" type="tel" placeholder="+7 999 123-45-67" required />
              </label>
              <label>
                Адрес
                <textarea name="address" rows="3" placeholder="Город, улица, дом, квартира" required></textarea>
              </label>
              <label>
                Ник в Telegram
                <input name="telegram" type="text" placeholder="@username" />
              </label>
              <div class="checkout-summary">
                <span>Итого</span>
                <strong data-cart-total>0 ₽</strong>
              </div>
              <button class="button button--solid button--full" type="submit">Отправить заказ</button>
              <p class="form-status" data-checkout-status></p>
            </form>
          </div>
        </section>
      </main>

    </div>

    <script type="module" src="/main.js"></script>
  </body>
</html>
