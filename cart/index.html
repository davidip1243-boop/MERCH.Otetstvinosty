<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Корзина магазина Ответственности." />
    <title>Корзина | Ответственности</title>
    <link rel="icon" href="/assets/images/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/assets/images/favicon.png" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body data-page="cart">
    <div class="scroll-progress" data-scroll-progress aria-hidden="true"></div>
    <header class="topbar">
      <a class="brand" href="/" aria-label="Ответственности">
        <img class="brand-mark" src="/assets/images/menu-logo.png" alt="" />
        <span class="brand-copy">
          <span>Мерч команды</span>
          <span>по ответственностям</span>
        </span>
      </a>
      <nav class="topnav" aria-label="Основная навигация">
        <a href="/">Главная</a>
        <a href="/catalog/">Каталог</a>
        <a href="/about/">О нас</a>
      </nav>
      <div class="topbar-actions">
        <button class="round-action" data-theme-toggle aria-label="Переключить тему" title="Тема">
          ◐
        </button>
        <a class="round-action cart-link" href="/cart/" aria-label="Корзина">
          🛒
          <span data-cart-count>0</span>
        </a>
      </div>
    </header>

    <main>
      <section class="cart-page reveal">
        <div class="cart-copy">
          <p class="label">Корзина</p>
          <h1>Проверьте заказ перед передачей команде.</h1>
        </div>
        <div class="cart-board">
          <div class="cart-list-panel" data-cart-list></div>
          <div class="cart-order-panel">
            <div class="cart-total">
              <span>Итого</span>
              <strong data-cart-total>0 ₽</strong>
            </div>
            <form class="checkout-form" data-order-form>
              <label>
                Имя
                <input name="name" type="text" placeholder="Как к вам обращаться" required />
              </label>
              <label>
                Контакт
                <input name="contactInfo" type="text" placeholder="Telegram, телефон или Gmail" required />
              </label>
              <label>
                Адрес
                <input name="address" type="text" placeholder="Город, улица, дом, квартира" required />
              </label>
              <button class="button button-primary" type="submit">Заказать</button>
              <p class="order-status" data-order-status role="status" aria-live="polite"></p>
            </form>
          </div>
        </div>
      </section>
      <footer class="site-footer">
        <h2>Вера<br />в каждом<br /><span>стежке</span></h2>
      </footer>
    </main>

    <script src="/main.js" type="module"></script>
  </body>
</html>
